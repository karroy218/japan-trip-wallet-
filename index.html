

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅日記帳 🐱</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f9f5ec;color:#394c40;font-family:system-ui,sans-serif}
header{background:#dce9dc;padding:24px 18px;text-align:center}
h1{margin:0;font-size:27px}
header p{margin:8px 0;color:#657c69}
main{max-width:550px;margin:auto;padding:16px 16px 90px}
.card{background:white;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #53634b12}
h2{font-size:18px;margin:0 0 15px}
input,select,button{font:inherit}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;background:#fff}
button{border:0;border-radius:12px;background:#779b7d;color:white;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#eee9df;color:#44594a}
.full{width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f2f6ef;padding:13px;border-radius:12px}
.stat b{display:block;font-size:21px;margin-top:6px}
small{color:#798578}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 4px;border-top:1px solid #ddd}
nav button{background:none;color:#55745d;padding:9px 5px;font-size:13px}
.page{display:none}
.page.active{display:block}
.item{padding:12px 0;border-bottom:1px solid #eee}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#e8efe5;border-radius:30px;padding:5px 10px;font-size:12px}
.cat{text-align:center;font-size:55px;margin:10px}
.bar{height:12px;background:#e8e8e1;border-radius:12px;overflow:hidden}
.fill{height:100%;background:#83a78b;width:0}
label{font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
<div style="font-size:42px">🐱🌸🗻</div>
<h1>旅日記帳</h1>
<p>Japan Trip Wallet</p>
<small>收集旅途中的每一筆美好回憶</small>
</header>
<main>
<section id="home" class="page active">
<div class="card">
<h2>🌸 我的日本旅行</h2>
<label>旅行名稱</label>
<input id="trip" value="日本自由行">
<label>旅行預算（日幣）</label>
<input id="budget" type="number" value="100000">
<label>1 日幣等於多少台幣</label>
<input id="rate" type="number" step="0.0001" value="0.21">
<button class="full" onclick="saveSettings()">儲存旅行設定</button>
</div>
<div class="card">
<h2>💰 旅行小金庫</h2>
<div class="stats">
<div class="stat">總預算<b id="totalBudget">¥0</b></div>
<div class="stat">已花費<b id="spent">¥0</b></div>
<div class="stat">剩餘預算<b id="remain">¥0</b></div>
<div class="stat">約新台幣<b id="twd">NT$0</b></div>
</div>
<p>預算使用進度</p>
<div class="bar"><div class="fill" id="progress"></div></div>
</div>
<div class="card">
<div class="cat">🐱🧳</div>
<p style="text-align:center">今天也一起記錄日本旅行吧！</p>
<button class="full" onclick="show('add')">＋ 新增消費紀錄</button>
</div>
</section>
<section id="add" class="page">
<div class="card">
<h2>📸 收據記帳</h2>
<p>拍照保存日本收據</p>
<input type="file" id="photo" accept="image/*" capture="environment">
<small>雲端 AI 自動辨識尚未啟用，現階段請手動填寫。</small>
</div>
<div class="card">
<h2>✏️ 新增消費</h2>
<label>日期</label>
<input id="date" type="date">
<label>店家</label>
<input id="shop" placeholder="例如：松本清">
<label>商品（日文或中文）</label>
<input id="product" placeholder="例如：面膜">
<label>金額（日幣）</label>
<input id="amount" type="number" placeholder="例如：1850">
<label>消費分類</label>
<select id="category">
<option>藥妝</option><option>食品</option>
<option>文具</option><option>服飾</option>
<option>交通</option><option>住宿</option>
<option>伴手禮</option><option>其他</option>
</select>
<label>付款方式</label>
<select id="payment">
<option>現金</option><option>信用卡</option><option>其他</option>
</select>
<label>付款人</label>
<input id="payer" value="我">
<label>分攤人數</label>
<input id="people" type="number" min="1" value="1">
<button class="full" onclick="addExpense()">🐾 儲存這筆消費</button>
</div>
</section>
<section id="records" class="page">
<div class="card">
<h2>🧾 消費紀錄</h2>
<div id="recordList"></div>
</div>
</section>
<section id="split" class="page">
<div class="card">
<h2>👫 旅伴拆帳</h2>
<p>每筆消費依設定人數平均分攤。</p>
<div id="splitList"></div>
</div>
</section>
<section id="report" class="page">
<div class="card">
<h2>📊 消費統計</h2>
<div id="categoryList"></div>
</div>
<div class="card">
<h2>📁 匯出旅行帳本</h2>
<p>下載 Excel 可開啟的 CSV 明細。</p>
<button class="full" onclick="exportCSV()">匯出 CSV 報表</button>
</div>
</section>
</main>
<nav>
<button onclick="show('home')">🏠<div>首頁</div></button>
<button onclick="show('records')">🧾<div>紀錄</div></button>
<button onclick="show('add')">📸<div>記帳</div></button>
<button onclick="show('split')">👫<div>拆帳</div></button>
<button onclick="show('report')">📊<div>統計</div></button>
</nav>
<script>
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Number(n).toLocaleString("ja-JP");
const nt=n=>"NT$"+Math.round(n).toLocaleString("zh-TW");
let expenses=JSON.parse(localStorage.getItem("japan_expenses")||"[]");
let settings=JSON.parse(localStorage.getItem("japan_settings")||'{"trip":"日本自由行","budget":100000,"rate":0.21}');
function save(){
localStorage.setItem("japan_expenses",JSON.stringify(expenses));
render();
}
function saveSettings(){
settings={trip:$("trip").value,budget:Number($("budget").value),rate:Number($("rate").value)};
localStorage.setItem("japan_settings",JSON.stringify(settings));
render();alert("旅行設定已儲存！");
}
function show(id){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
$(id).classList.add("active");
render();window.scrollTo(0,0);
}
function addExpense(){
let amount=Number($("amount").value);
let people=Number($("people").value);
if(!amount||amount<=0||!Number.isInteger(people)||people<1){alert("請填寫有效金額與分攤人數");return;}
expenses.push({
id:Date.now(),date:$("date").value,
shop:$("shop").value||"未命名店家",
product:$("product").value||"未命名商品",
amount,category:$("category").value,
payment:$("payment").value,
payer:$("payer").value||"我",people
});
save();
["shop","product","amount"].forEach(id=>$(id).value="");
show("records");
}
function removeExpense(id){
if(confirm("確定刪除這筆消費？")){
expenses=expenses.filter(e=>e.id!==id);save();
}}
function render(){
let total=expenses.reduce((s,e)=>s+e.amount,0);
$("totalBudget").textContent=yen(settings.budget);
$("spent").textContent=yen(total);
$("remain").textContent=yen(settings.budget-total);
$("twd").textContent=nt(total*settings.rate);
$("progress").style.width=(settings.budget?Math.min(100,total/settings.budget*100):0)+"%";
$("recordList").innerHTML=expenses.length?expenses.slice().reverse().map(e=>`
<div class="item">
<div class="row"><b>${escapeHTML(e.shop)}</b><b>${yen(e.amount)}</b></div>
<small>${escapeHTML(e.date)} · ${escapeHTML(e.product)} · ${escapeHTML(e.category)}</small>
<div><button class="secondary" onclick="removeExpense(${e.id})">刪除</button></div>
</div>`).join(""):"🐱 還沒有消費紀錄";
$("splitList").innerHTML=expenses.length?expenses.map(e=>`
<div class="item"><b>${escapeHTML(e.shop)}</b><br>
付款人：${escapeHTML(e.payer)}<br>
總額：${yen(e.amount)}<br>
${e.people} 人平均，每人 ${yen(Math.round(e.amount/e.people))}
</div>`).join(""):"尚無拆帳紀錄";
let groups={};
expenses.forEach(e=>groups[e.category]=(groups[e.category]||0)+e.amount);
$("categoryList").innerHTML=Object.entries(groups).map(([k,v])=>`
<div class="item row"><span>${escapeHTML(k)}</span><b>${yen(v)}</b></div>`).join("")||"尚無統計資料";
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function exportCSV(){
let rows=[["日期","店家","商品","分類","日幣","台幣","付款方式","付款人","分攤人數"]];
expenses.forEach(e=>rows.push([e.date,e.shop,e.product,e.category,e.amount,(e.amount*settings.rate).toFixed(2),e.payment,e.payer,e.people]));
let csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
a.download="日本旅行記帳.csv";a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("date").value=new Date().toLocaleDateString("en-CA");
$("trip").value=settings.trip;
$("budget").value=settings.budget;
$("rate").value=settings.rate;
render();
</script>
</body>
</html>
